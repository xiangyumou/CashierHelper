name: Release

# 每次推送到 main 都发布一个 Release。一次推送包含多个提交时，只有最后一个提交
# 会进入这里；靠固定并发组串行排队，避免多个运行争抢同一版本号。
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cashierhelper-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    name: Build and publish the signed release APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the commit that triggered the run
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test the release tooling
        run: python3 scripts/test_release.py

      # 先分配版本并创建草稿 Release，附件上传完成后再公开，避免下载到不完整的版本。
      - name: Reserve the release version
        id: version
        run: |
          python3 scripts/release.py prepare \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Write the signing keystore
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          # runner 上下文在 workflow 级别的 env 里不可用，只能放在步骤级别。
          CASHIERHELPER_KEYSTORE_PATH: ${{ runner.temp }}/cashierhelper-release.keystore
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CASHIERHELPER_KEYSTORE_PATH"
          chmod 600 "$CASHIERHELPER_KEYSTORE_PATH"

      - name: Test, lint and build the signed release
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          CASHIERHELPER_REQUIRE_SIGNING: "true"
          CASHIERHELPER_KEYSTORE_PATH: ${{ runner.temp }}/cashierhelper-release.keystore
          CASHIERHELPER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CASHIERHELPER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CASHIERHELPER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --stacktrace testDebugUnitTest lintDebug assembleRelease \
            -PreleaseVersionName="$VERSION_NAME" \
            -PreleaseVersionCode="$VERSION_CODE"

      - name: Verify the APK signature and embedded version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk" || { echo "缺少签名后的 APK：$apk"; exit 1; }

          build_tools="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"

          package_line="$("$build_tools/aapt2" dump badging "$apk" | head -n 1)"
          tokens="$(printf '%s\n' "$package_line" | tr ' ' '\n')"
          actual_code="$(printf '%s\n' "$tokens" | grep -m1 '^versionCode=' | cut -d"'" -f2)"
          actual_name="$(printf '%s\n' "$tokens" | grep -m1 '^versionName=' | cut -d"'" -f2)"
          if [ "$actual_code" != "$VERSION_CODE" ] || [ "$actual_name" != "$VERSION_NAME" ]; then
            echo "APK 内嵌版本为 $actual_name / $actual_code，期望 $VERSION_NAME / $VERSION_CODE"
            exit 1
          fi
          echo "APK 版本校验通过：$actual_name / $actual_code"

      - name: Stage the release assets
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          python3 scripts/release.py stage-assets \
            --apk app/build/outputs/apk/release/app-release.apk \
            --mapping app/build/outputs/mapping/release/mapping.txt \
            --out-dir release-assets \
            --version-name "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the assets and publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          RELEASE_ID: ${{ steps.version.outputs.release_id }}
        run: |
          set -euo pipefail
          python3 scripts/release.py publish \
            --release-id "$RELEASE_ID" \
            --dir release-assets \
            --sha "$GITHUB_SHA"

      - name: Delete the signing keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cashierhelper-release.keystore" 2>/dev/null || true
