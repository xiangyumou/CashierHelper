name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, lint and assemble
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test the release tooling
        run: python3 scripts/test_release.py

      - name: Test, lint and assemble the app
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Upload the test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 7
